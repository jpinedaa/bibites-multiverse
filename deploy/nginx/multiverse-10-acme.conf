# Port 80: the ACME HTTP-01 challenge, and nothing else.
#
# Rendered by provision.sh from deploy/nginx/multiverse-10-acme.conf.
# DO NOT EDIT IN PLACE — the next provision run overwrites it.
#
# WHY PORT 80 IS OPEN AT ALL. The relay owns 443 whole (the owner's call,
# 2026-08-12), so the certificate cannot be validated on the port it protects.
# HTTP-01 through a webroot is the mechanism that works with EVERY registrar and
# needs no API credential, which matters because the registrar has not been
# chosen. The exposure is one directory of short-lived challenge files served by
# nginx; every other path on this port is a 404 or a redirect to the status page.
#
# The alternative is DNS-01, which closes this port entirely and needs a certbot
# plugin for whichever registrar the owner picks. deploy.env's MV_ACME_MODE is
# the switch, and provision.sh refuses rather than guessing a provider.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The only thing on this port that serves a file.
    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type "text/plain";
        access_log off;
    }

    # A person who types the bare name gets the page they were looking for.
    location = / {
        return 301 https://@@MV_DOMAIN@@:@@MV_STATUS_PORT@@/;
    }

    location / {
        return 404;
    }
}
