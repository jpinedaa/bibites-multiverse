# One public HTTPS front door for the website and the Contract B relay.
#
# Rendered by provision.sh from deploy/nginx/multiverse-20-status.conf.
# DO NOT EDIT IN PLACE — the next provision run overwrites it.
#
# THIS FILE IS THE ANSWER TO docs/defaults-audit.md's FINDING FOR WP3. The
# project's own bring-up passes ARCHIVE_HTTP=0.0.0.0:8796, and the runbook says
# so in five places. On a LAN with six known worlds that is right; copying it
# onto a public VPS gets an unauthenticated, unrated, unproxied listener on a box
# whose disk the same process is filling. The archive here stays on
# 127.0.0.1:8796 and nginx is what makes the page public.
#
# THE DECISION, AND ITS BOUNDARY.
#
#   PUBLIC WEBSITE, on purpose, AS A RULE RATHER THAN AS A LIST: every handler on the
#   archive's HTTP mux, and that mux is read-only by construction. `location /`
#   below proxies the whole surface, so an endpoint added to
#   go/internal/archive/page.go is published the moment the binary ships — which
#   is why the rule is what a reviewer checks and the roster is only its current
#   value. At the commit this file was last read against, the roster is twenty:
#   /, /live, /watch, /map, /favicon.svg, /social-card.svg, /social-card.png,
#   /social-card-watch.png, /social-card-live.png, /robots.txt, /sitemap.xml,
#   /healthz, /api/status, /api/hops, /api/species, /api/species/tree,
#   /api/species/trends, /api/species/brains, /api/species/history,
#   /api/history.
#   A new one has two questions to answer: does it mutate anything (nothing on
#   this mux does, and limit_except below is the second half of that answer), and
#   does it carry anything the relay does not already broadcast to every peer.
#   WP7's participant documentation promises the page (diagnose.md: "the map also
#   publishes a page with every world on it"), and join.md states before anybody
#   joins exactly what the map broadcasts about their world. Nothing on the page
#   is a secret, because nothing on the wire is: what the page shows is what the
#   relay already broadcasts to every peer. It is also where a refused peer reads
#   the game build the map is on (error-taxonomy.md §3.2, B-4003c).
#
#   PUBLIC ANNOUNCEMENTS: /announcements, served from @@WWW_ROOT@@ on disk and
#   never proxied. It is deliberately outside the archive so that a service
#   notice survives the outage it announces. It is static, read-only, and
#   carries no input of any kind. Its content file is operator-written prose,
#   which is the one place on this front door where a human edit reaches a
#   participant's browser directly: ANNOUNCEMENT.md governs what may go in it.
#
#   PUBLIC VIEWER PRESENCE: /api/viewers, served from @@WWW_ROOT@@ on disk and
#   never proxied. It says whether anyone is watching the broadcast, so that the
#   publisher can stop while nobody is. It carries no input, names no viewer and
#   no address, and reports two aggregates: a session count and the age of the
#   most recent viewer request. It is outside the archive because a stopped or
#   replaying archive must not read as an empty room.
#
#   PUBLIC RELAY: every path below /contract-b/. nginx terminates TLS and sends
#   the WebSocket connection to the loopback relay. nginx replaces
#   X-Forwarded-For with the direct client address. The relay trusts that header
#   only when its direct peer is loopback. This preserves the per-address cap.
#
#   PUBLIC ENROLLMENT: POST /api/enroll creates one bounded peer credential for
#   a new installer. nginx applies an outer per-address rate limit and replaces
#   X-Forwarded-For. The relay applies its own daily and total limits and stores
#   only a verifier. This is the only public request that changes relay state.
#
#   NOT PUBLIC: both upstream listeners; the relay's admin path (B28 — compiled
#   in, bound to nothing); the data directories; the credential verifier store;
#   SSH. Nothing on the website mutates anything. GET and HEAD are the only
#   methods that reach the archive; POST is allowed only at the exact enrollment
#   path and reaches the relay instead.
#
#   THE COST, NAMED: measured, the live console costs ~12.3 GB/month per
#   continuously open browser tab, counting every endpoint the page polls and
#   not the status endpoint alone. That is a small term beside the peer wire
#   and the video stream, and it moves whenever the page adds an endpoint or
#   changes its cadence. deploy/SIZING.md, "Network transfer", owns the
#   measurements and the model; do not restate them here. Gzip negotiation is
#   the archive's own (go/internal/archive/compress.go); this proxy passes
#   Accept-Encoding through untouched and compresses nothing itself, so the
#   saving is preserved rather than re-implemented.

# Both zones live in the http context, which is what conf.d is.
limit_req_zone  $binary_remote_addr zone=mvstatus:1m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=mvenroll:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=mvconn:1m;

server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is a listen parameter. The
    # standalone `http2 on` directive starts in nginx 1.25.1.
    listen @@MV_RELAY_PORT@@ ssl http2;
    listen [::]:@@MV_RELAY_PORT@@ ssl http2;
    server_name @@MV_DOMAIN@@;

    # nginx owns the public certificate and reloads it after renewal.
    ssl_certificate     @@MV_TLSDIR@@/fullchain.pem;
    ssl_certificate_key @@MV_TLSDIR@@/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:mvtls:2m;
    ssl_session_timeout 1h;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;

    limit_req_status 429;
    limit_conn_status 429;

    # nginx compresses nothing: the archive negotiates gzip itself and sets Vary.
    gzip off;

    access_log /var/log/nginx/multiverse-front-door.access.log combined buffer=32k flush=10s;
    error_log  /var/log/nginx/multiverse-front-door.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # All public pages are intentionally self-contained. Inline CSS and script
    # keep the archive usable without a build pipeline or an outside asset host;
    # every network read they make stays on this origin.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'none'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location = /api/enroll {
        limit_except POST { deny all; }

        limit_req  zone=mvenroll burst=3 nodelay;
        limit_conn mvconn 2;

        proxy_pass http://@@MV_RELAY_BACKEND@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Replace any client-supplied chain. The relay accepts one address only.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
        proxy_buffering on;
    }

    location ^~ /contract-b/ {
        proxy_pass http://@@MV_RELAY_BACKEND@@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        # Replace any client-supplied chain. The relay accepts one address only.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    1d;
        proxy_send_timeout    1d;
        proxy_buffering off;
    }

    location ^~ /stream/ {
        # Viewers can read one shared HLS stream. Publishing is possible only on
        # the private RTMP listener and never passes through this front door.
        limit_except GET HEAD { deny all; }

        # No request-rate limit here, and the reason has changed but the answer
        # has not yet. It was that low-latency HLS sends frequent playlist and
        # part requests, so a rate limit rejects valid players and makes them
        # retry. The origin is fmp4 now (install-stream-origin.sh), which fetches
        # one playlist for each segment and would tolerate a rate limit — adding
        # one is a separate change with its own zone and its own measurement.
        limit_conn mvconn 24;

        proxy_pass http://@@MV_STREAM_HLS_BACKEND@@/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # MediaMTX emits absolute-path cookie-check redirects. Keep those paths
        # inside this reverse-proxy prefix instead of sending them to the archive.
        proxy_redirect ~^/(.*)$ /stream/$1;
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    location = /api/viewers {
        # IS ANYONE WATCHING? A file on disk, not a backend.
        #
        # The publisher costs approximately 780 GB of inbound transfer a month
        # whether or not anyone watches, so it publishes only while someone does.
        # Nothing on this host can start it — it is OBS on a Windows machine, and
        # this host holds no credential for it — so the Windows side polls this
        # endpoint and starts or stops itself. multiverse-viewers.timer rewrites
        # the document every ten seconds; see deploy/viewers-presence.sh for the
        # contract and for how presence is measured.
        #
        # It is static for the same reason /announcements/ is: the archive being
        # stopped or replaying must not read as an empty room and take the
        # broadcast down with it.
        #
        # An exact-match location beats every prefix location whatever the order
        # in this file, so this is what answers /api/viewers and `location /`
        # keeps every other /api/ path.
        limit_except GET HEAD { deny all; }

        # The same zone /api/status gets through `location /`. mvstatus is 5r/s,
        # and a watcher polling every ten seconds is 0.1r/s.
        limit_req  zone=mvstatus burst=20 nodelay;
        limit_conn mvconn 8;

        alias @@WWW_ROOT@@/multiverse-status/viewers.json;
        types { }
        default_type application/json;

        # nginx's add_header REPLACES the inherited set rather than adding to it,
        # so every header this endpoint needs is repeated here. Dropping them
        # silently is the failure this comment exists to prevent.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    # The bare path is a directory; send it to the trailing-slash form. This is
    # an exact match, so /announcements-anything still reaches the archive and
    # gets the site's own 404 rather than nginx's.
    location = /announcements {
        return 301 /announcements/;
    }

    location ^~ /announcements/ {
        # THE ONE PAGE THAT MUST OUTLIVE THE ARCHIVE. What this page announces is
        # usually that the archive is about to stop; an archive route would take
        # the notice offline for exactly the window it describes, and the site is
        # dark for the whole of a ledger replay. nginx reads it from disk, so it
        # answers while the archive is stopped, replaying, or failed.
        #
        # Two files: index.html is chrome that provision.sh renders and owns, and
        # notices.html is the content an operator edits in place. `ssi on` joins
        # them per request, so posting a notice costs one file write — no reload,
        # no restart, no rebuild. Both are static; nothing here reaches a backend.
        limit_except GET HEAD { deny all; }

        limit_req  zone=mvstatus burst=20 nodelay;
        limit_conn mvconn 8;

        root @@WWW_ROOT@@;
        index index.html;
        ssi on;
        # A notice is posted by hand and read minutes later. Thirty seconds keeps
        # a reload cheap without making a correction wait.
        expires 30s;
    }

    location / {
        # A read-only surface, enforced here rather than trusted upstream.
        limit_except GET HEAD { deny all; }

        limit_req  zone=mvstatus burst=20 nodelay;
        limit_conn mvconn 8;

        proxy_pass http://@@MV_ARCHIVE_HTTP@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Explicit pass-through, so the archive's own negotiation is what decides.
        proxy_set_header Accept-Encoding   $http_accept_encoding;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering on;
    }
}
