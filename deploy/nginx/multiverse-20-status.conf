# The status page, published deliberately: TLS, read-only, rate limited, on its
# own port.
#
# Rendered by provision.sh from deploy/nginx/multiverse-20-status.conf.
# DO NOT EDIT IN PLACE — the next provision run overwrites it.
#
# THIS FILE IS THE ANSWER TO docs/defaults-audit.md's FINDING FOR WP3. The
# project's own bring-up passes ARCHIVE_HTTP=0.0.0.0:8796, and the runbook says
# so in five places. On a LAN with six known worlds that is right; copying it
# onto a public VPS gets an unauthenticated, unrated, unproxied listener on a box
# whose disk the same process is filling. The archive here stays on
# 127.0.0.1:8796 and nginx is what makes the page public.
#
# THE DECISION, AND ITS BOUNDARY.
#
#   PUBLIC, on purpose: the seven read-only GET handlers — /, /healthz,
#   /api/status, /api/hops, /api/species, /api/species/history, /api/history.
#   WP7's participant documentation promises the page (diagnose.md: "the map also
#   publishes a page with every world on it"), and join.md states before anybody
#   joins exactly what the map broadcasts about their world. Nothing on the page
#   is a secret, because nothing on the wire is: what the page shows is what the
#   relay already broadcasts to every peer. It is also where a refused peer reads
#   the game build the map is on (error-taxonomy.md §3.2, B-4003c).
#
#   NOT PUBLIC: the archive's own listener (loopback); the relay's admin path
#   (B28 — compiled in, bound to nothing); the data directories; the credential
#   verifier store; SSH. Nothing here mutates anything: GET and HEAD are the only
#   methods that reach the archive at all.
#
#   THE COST, NAMED: the status page is the largest single egress term in the
#   service — larger than the game traffic — at ~32 GB/month per continuously
#   open browser tab uncompressed, ~4 GB gzipped. Gzip negotiation is the
#   archive's own (go/internal/archive/compress.go); this proxy passes
#   Accept-Encoding through untouched and compresses nothing itself, so the
#   saving is preserved rather than re-implemented.

# Both zones live in the http context, which is what conf.d is.
limit_req_zone  $binary_remote_addr zone=mvstatus:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=mvconn:1m;

server {
    listen @@MV_STATUS_PORT@@ ssl;
    listen [::]:@@MV_STATUS_PORT@@ ssl;
    http2 on;
    server_name @@MV_DOMAIN@@;

    # The same pair the relay serves on 443. A certificate binds NAMES, NOT
    # PORTS, so one certificate covers both listeners. The deploy hook keeps this
    # copy current and reloads nginx; the relay needs neither.
    ssl_certificate     @@MV_TLSDIR@@/fullchain.pem;
    ssl_certificate_key @@MV_TLSDIR@@/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:mvtls:2m;
    ssl_session_timeout 1h;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;

    limit_req  zone=mvstatus burst=20 nodelay;
    limit_conn mvconn 8;
    limit_req_status 429;
    limit_conn_status 429;

    # nginx compresses nothing: the archive negotiates gzip itself and sets Vary.
    gzip off;

    access_log /var/log/nginx/multiverse-status.access.log combined buffer=32k flush=10s;
    error_log  /var/log/nginx/multiverse-status.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        # A read-only surface, enforced here rather than trusted upstream.
        limit_except GET HEAD { deny all; }

        proxy_pass http://@@MV_ARCHIVE_HTTP@@;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Explicit pass-through, so the archive's own negotiation is what decides.
        proxy_set_header Accept-Encoding   $http_accept_encoding;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_buffering on;
    }
}
