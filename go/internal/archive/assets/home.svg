<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bibites Multiverse — Evolution has a map.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0b1110"/><stop offset="1" stop-color="#101b18"/></linearGradient>
<radialGradient id="gg" gradientUnits="userSpaceOnUse" cx="990" cy="46" r="560"><stop offset="0" stop-color="#43a07e" stop-opacity=".34"/><stop offset="1" stop-color="#43a07e" stop-opacity="0"/></radialGradient>
