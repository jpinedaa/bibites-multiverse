<path d="M916 214v12"/><path d="M916 378v-12"/><path d="M806 296h12"/><path d="M1026 296h-12"/>
</g>

<g transform="translate(931.1 298) scale(14)"><path fill="url(#bib)" filter="url(#glb)" d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/><circle cx="1.5" cy="-1.85" r="1" fill="#07100d"/></g>

<text class="cp" x="726" y="500">one world · one camera</text>
<text class="cp" x="1106" y="500" text-anchor="end">chosen: the youngest life</text>
