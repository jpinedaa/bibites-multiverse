<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bibites Multiverse live broadcast — Follow a life in progress.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0b1110"/><stop offset="1" stop-color="#101b18"/></linearGradient>
<radialGradient id="gg" gradientUnits="userSpaceOnUse" cx="990" cy="46" r="560"><stop offset="0" stop-color="#43a07e" stop-opacity=".34"/><stop offset="1" stop-color="#43a07e" stop-opacity="0"/></radialGradient>
<radialGradient id="gb" gradientUnits="userSpaceOnUse" cx="70" cy="560" r="520"><stop offset="0" stop-color="#3e7eae" stop-opacity=".22"/><stop offset="1" stop-color="#3e7eae" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="600" cy="315" r="700"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
<radialGradient id="spot" gradientUnits="userSpaceOnUse" cx="916" cy="300" r="230"><stop offset="0" stop-color="#43a07e" stop-opacity=".38"/><stop offset="1" stop-color="#43a07e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#75bdf2" stroke-opacity=".085" stroke-width="1"/></pattern>
<pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h6" stroke="#eff7f3" stroke-opacity=".045" stroke-width="1"/></pattern>
<pattern id="tick" width="19" height="14" patternUnits="userSpaceOnUse"><path d="M.5 0v6" stroke="#9aafa7" stroke-opacity=".34"/></pattern>
<pattern id="tick5" width="95" height="14" patternUnits="userSpaceOnUse"><path d="M.5 0v12" stroke="#9aafa7" stroke-opacity=".45"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="gm"><rect width="1200" height="630" fill="url(#fade)"/></mask>
<linearGradient id="pg" x1="700" y1="82" x2="1132" y2="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#17241f" stop-opacity=".97"/><stop offset="1" stop-color="#080f0d" stop-opacity=".85"/></linearGradient>
<filter id="sh" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="glb" x="-120%" y="-140%" width="340%" height="380%"><feGaussianBlur stdDeviation=".45" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur"><feGaussianBlur stdDeviation="1.4"/></filter>
<linearGradient id="bib" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="#66e0ac"/><stop offset="1" stop-color="#66e0ac" stop-opacity=".58"/></linearGradient>
<clipPath id="pclip"><rect x="700" y="82" width="432" height="438" rx="24"/></clipPath>
<style>
.eb{font:700 16px "Ubuntu Sans Mono","Ubuntu Mono","DejaVu Sans Mono","Liberation Mono",monospace;letter-spacing:3.2px}
.hl{font:800 96px "Ubuntu Sans","Ubuntu","DejaVu Sans","Liberation Sans",sans-serif;letter-spacing:-4.2px;fill:#eff7f3}
.sb{font:400 24px "Ubuntu Sans","Ubuntu","DejaVu Sans","Liberation Sans",sans-serif;fill:#9aafa7}
.mt{font:500 15px "Ubuntu Sans Mono","Ubuntu Mono","DejaVu Sans Mono","Liberation Mono",monospace;letter-spacing:1.3px;fill:#9aafa7}
.lb{font:700 12px "Ubuntu Sans Mono","Ubuntu Mono","DejaVu Sans Mono","Liberation Mono",monospace;letter-spacing:1.8px;fill:#9aafa7}
.cp{font:400 12.5px "Ubuntu Sans","Ubuntu","DejaVu Sans",sans-serif;fill:#9aafa7;opacity:.82}
</style>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#grid)" mask="url(#gm)"/>
<rect width="1200" height="630" fill="url(#gg)"/>
<rect width="1200" height="630" fill="url(#gb)"/>
<rect width="1200" height="630" fill="url(#vig)"/>

<g stroke="#66e0ac" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="square">
<path d="M34 60V34h26"/><path d="M1140 34h26v26"/><path d="M34 570v26h26"/><path d="M1166 570v26h-26"/>
</g>

<g transform="translate(91 86) scale(2.2)"><path fill="#66e0ac" d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/><circle cx="1.5" cy="-1.85" r="1" fill="#07100d"/></g>
<text class="eb" x="120" y="93" fill="#66e0ac">BIBITES MULTIVERSE<tspan fill="#efbd57"> · LIVE BROADCAST</tspan></text>

<text class="hl" x="76" y="248">Follow a life</text>
<text class="hl" x="76" y="352">in progress.</text>
<text class="sb" x="78" y="410">Everyone watches the same world. The</text>
<text class="sb" x="78" y="443">camera follows the youngest living Bibite</text>
<text class="sb" x="78" y="476">until it dies or migrates away.</text>

<path d="M76 536h1048" stroke="#294038" stroke-width="1.5"/><path d="M76 536h66" stroke="#efbd57" stroke-width="2.5"/>
<text class="mt" x="78" y="566">bibitesmultiverse.com<tspan fill="#efbd57">/watch</tspan></text>
<text class="mt" x="1124" y="566" text-anchor="end" opacity=".7">SPECTATOR CAMERA · NO CONTROLS</text>

<g filter="url(#sh)"><rect x="700" y="82" width="432" height="438" rx="24" fill="url(#pg)" stroke="#294038" stroke-width="1.5"/></g>
<g clip-path="url(#pclip)">
  <rect x="700" y="82" width="432" height="438" fill="url(#spot)"/>
  <rect x="700" y="82" width="432" height="438" fill="url(#grid)" opacity=".4"/>
  <rect x="700" y="82" width="432" height="438" fill="url(#scan)"/>
</g>

<circle cx="732" cy="116" r="9" fill="#efbd57" opacity=".18"/><circle cx="732" cy="116" r="4" fill="#efbd57"/>
<text class="lb" x="750" y="120">LIVE · ONE SHARED CAMERA</text>
<rect x="726" y="140" width="380" height="14" fill="url(#tick)"/>
<rect x="726" y="140" width="380" height="14" fill="url(#tick5)"/>

<g filter="url(#blur)" fill="#66e0ac" opacity=".17">
<g transform="translate(778 192) scale(4.2)"><path d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/></g>
<g transform="translate(1092 208) scale(3.4)"><path d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/></g>
<g transform="translate(1080 440) scale(4.6)"><path d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/></g>
<g transform="translate(766 436) scale(3.6)"><path d="M4.5-1.26 2.16 0l2.34 1.26C4.14 3.06 1.98 4.14-.54 4.14-3.24 4.14-5.58 2.16-6.66 0-5.58-2.16-3.24-4.14-.54-4.14c2.52 0 4.68 1.08 5.04 2.88Z"/></g>
</g>

<path d="M714 430C796 406 852 342 916 300c64-42 124-74 202-98" fill="none" stroke="#66e0ac" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 9"/>
<rect x="806" y="214" width="220" height="164" fill="none" stroke="#efbd57" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 7"/>
<g stroke="#efbd57" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M806 248v-34h34"/><path d="M992 214h34v34"/><path d="M806 344v34h34"/><path d="M992 378h34v-34"/>
</g>
