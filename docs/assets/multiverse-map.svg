<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">A map of connected Bibites worlds</title>
  <desc id="description">Three independent simulation worlds exchange organisms through migration lanes while a public archive records their history.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101215"/>
      <stop offset="0.55" stop-color="#14191f"/>
      <stop offset="1" stop-color="#0d1116"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#4ec9a0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ec9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#5aa9e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5aa9e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2a3038" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05070a" flood-opacity="0.65"/>
    </filter>
    <filter id="laneGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#5aa9e6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#4ec9a0"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)" opacity="0.45"/>
  <ellipse cx="600" cy="270" rx="360" ry="245" fill="url(#greenGlow)"/>
  <ellipse cx="600" cy="270" rx="590" ry="210" fill="url(#blueGlow)"/>

  <text x="60" y="64" fill="#e6e9ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="2">EVOLUTION HAS A MAP</text>
  <text x="60" y="94" fill="#8b95a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="0.6">Independent simulations. Shared migration lanes. One public history.</text>

  <!-- Migration lanes sit behind the world cards. -->
  <g fill="none" stroke-linecap="round" filter="url(#laneGlow)">
    <path d="M350 271 H438" stroke="#5aa9e6" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M438 292 H350" stroke="#4ec9a0" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M762 271 H850" stroke="#4ec9a0" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M850 292 H762" stroke="#5aa9e6" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M588 151 V116" stroke="#5aa9e6" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowBlue)"/>
    <path d="M612 116 V151" stroke="#4ec9a0" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowGreen)"/>
    <path d="M588 382 V420" stroke="#4ec9a0" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowGreen)"/>
    <path d="M612 420 V382" stroke="#5aa9e6" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- West world. -->
  <g filter="url(#shadow)">
    <rect x="60" y="165" width="290" height="230" rx="16" fill="#191d22" stroke="#2a3038" stroke-width="2"/>
    <rect x="78" y="218" width="254" height="157" rx="10" fill="#14181d" stroke="#2a3038"/>
    <path d="M79 338 C132 300 179 364 235 316 C275 282 304 302 331 280 V375 H79Z" fill="#5aa9e6" opacity="0.12"/>
    <text x="82" y="197" fill="#8b95a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">NEIGHBOR WORLD</text>
    <circle cx="300" cy="193" r="5" fill="#4ec9a0"/>
    <text x="312" y="198" fill="#4ec9a0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">LIVE</text>
    <g transform="translate(129 273)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#e2b93b"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#e2b93b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(260 325) scale(.8)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#e05561"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#e05561" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Your world. -->
  <g filter="url(#shadow)">
    <rect x="438" y="145" width="324" height="250" rx="18" fill="#191d22" stroke="#4ec9a0" stroke-width="2.5"/>
    <rect x="458" y="204" width="284" height="169" rx="11" fill="#14181d" stroke="#2f5e50"/>
    <path d="M459 343 C516 287 568 360 626 312 C674 272 709 303 741 266 V373 H459Z" fill="#4ec9a0" opacity="0.15"/>
    <text x="462" y="181" fill="#e6e9ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">YOUR WORLD</text>
    <rect x="657" y="161" width="81" height="25" rx="12.5" fill="#173a30" stroke="#4ec9a0"/>
    <text x="675" y="178" fill="#7de3c0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LOCAL</text>
    <g transform="translate(521 280) scale(1.05)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#4ec9a0"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#4ec9a0" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(640 332) scale(.85)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#5aa9e6"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#5aa9e6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(692 253) scale(.65)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#e2b93b"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#e2b93b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- East world. -->
  <g filter="url(#shadow)">
    <rect x="850" y="165" width="290" height="230" rx="16" fill="#191d22" stroke="#2a3038" stroke-width="2"/>
    <rect x="868" y="218" width="254" height="157" rx="10" fill="#14181d" stroke="#2a3038"/>
    <path d="M869 345 C919 306 962 348 1011 302 C1050 266 1086 294 1121 255 V375 H869Z" fill="#e05561" opacity="0.11"/>
    <text x="872" y="197" fill="#8b95a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">NEIGHBOR WORLD</text>
    <circle cx="1090" cy="193" r="5" fill="#4ec9a0"/>
    <text x="1102" y="198" fill="#4ec9a0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">LIVE</text>
    <g transform="translate(930 315) scale(.9)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#5aa9e6"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#5aa9e6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(1055 270) scale(.75)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="#4ec9a0"/>
      <circle cx="12" cy="-2" r="4" fill="#f4fffb"/>
      <circle cx="13" cy="-2" r="1.8" fill="#0b0e12"/>
      <path d="M-13 -7 L-23 -16 M-12 7 L-22 16" stroke="#4ec9a0" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Public archive. -->
  <g transform="translate(465 445)">
    <rect width="270" height="44" rx="22" fill="#191d22" stroke="#2a3038"/>
    <circle cx="25" cy="22" r="7" fill="none" stroke="#5aa9e6" stroke-width="2"/>
    <path d="M25 13 V31 M16 22 H34" stroke="#5aa9e6" stroke-width="1.5" opacity="0.7"/>
    <text x="45" y="27" fill="#8b95a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PUBLIC MIGRATION ARCHIVE</text>
  </g>

  <text x="60" y="482" fill="#8b95a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Each world keeps its own clock, settings, saves, and ecosystem.</text>
  <text x="1140" y="482" text-anchor="end" fill="#5aa9e6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">organisms cross both ways</text>
</svg>
