# Every check that can be proved without the proprietary game bytes.
#
# This file runs on GitHub-hosted runners only, and every `runs-on:` below must
# stay that way. The repository is public, so a fork's pull request can run
# this workflow; a runner label belonging to the release machine would hand
# that fork arbitrary code execution on it. For the same reason the trigger is
# `pull_request` and never `pull_request_target` — a fork gets a read-only
# token and no secrets. The audit is one command — every line it prints
# must name a GitHub-hosted image:
#
#     grep -E '^ *runs-on:' .github/workflows/checks.yml
#
# The release build, which does need the release machine, is release.yml.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # `go test ./...` measured 1 m 46 s locally, of which internal/sidecar is
    # 94 s. A shared runner is slower, so the budget is generous but finite.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # go/go.mod carries the toolchain this project builds with.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: go vet (host)
        run: go vet ./...

      # The launcher is a Windows program written on Linux, so the only place its
      # Windows build is checked is here and in make-release.sh's launcher step.
      # The window (internal/launchergui) is Win32 through and through — walk has
      # no other target — so a host vet never opens a line of it.
      - name: go vet (windows)
        env:
          GOOS: windows
        run: |
          go vet ./cmd/multiverse-launcher ./cmd/multiverse-launcher-gui \
                 ./internal/launcher ./internal/launchergui

      - name: go test
        timeout-minutes: 20
        run: go test ./...

      # The same cross-builds the release and the hosting kit perform, so a
      # platform-specific compile error is a pull-request failure rather than a
      # release-day one. Release: sidecar and launcher for Windows and Linux
      # (make-release.sh). Hosting kit: relay, archive and ringstat for
      # linux/amd64 and linux/arm64 (deploy/ship.sh:57-64).
      - name: cross-build the shipped binaries
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          for os in windows linux; do
            for cmd in sidecar multiverse-launcher; do
              CGO_ENABLED=0 GOOS="$os" GOARCH=amd64 \
                go build -trimpath -o "$out/$cmd-$os-amd64" "./cmd/$cmd"
              echo "    ok  $cmd $os/amd64"
            done
          done
          for arch in amd64 arm64; do
            for cmd in relay archive ringstat; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -o "$out/$cmd-linux-$arch" "./cmd/$cmd"
              echo "    ok  $cmd linux/$arch"
            done
          done
          # The window ships as BibitesMultiverseLauncher.exe, built for the
          # Windows GUI subsystem so that a double-clicked shortcut opens a window
          # with no console behind it. Its resource object — the Common Controls 6
          # manifest and the application icon — is build output and is generated
          # here exactly as make-release.sh generates it.
          go tool rsrc -manifest cmd/multiverse-launcher-gui/app.manifest \
            -ico ../release/kit/bibites-multiverse.ico \
            -arch amd64 -o cmd/multiverse-launcher-gui/rsrc_windows_amd64.syso
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-H=windowsgui" \
              -o "$out/BibitesMultiverseLauncher.exe" ./cmd/multiverse-launcher-gui
          echo "    ok  multiverse-launcher-gui windows/amd64"
          file "$out/sidecar-windows-amd64" | grep -q 'PE32+' \
            || { echo "!! the Windows sidecar is not a PE32+ executable" >&2; exit 1; }
          # THE TWO SUBSYSTEMS ARE THE REASON THERE ARE TWO LAUNCHERS: a window
          # built as a console program flashes a console up, and commands built as
          # a window program are not waited for by any shell, which silently
          # breaks every script that chains two of them.
          file "$out/BibitesMultiverseLauncher.exe" | grep -q 'PE32+ executable (GUI)' \
            || { echo "!! the launcher window is not a GUI-subsystem image" >&2
                 file "$out/BibitesMultiverseLauncher.exe" >&2; exit 1; }
          file "$out/multiverse-launcher-windows-amd64" | grep -q 'PE32+ executable (console)' \
            || { echo "!! the launcher's commands are not a console image" >&2
                 file "$out/multiverse-launcher-windows-amd64" >&2; exit 1; }
          file "$out/relay-linux-amd64" | grep -q 'statically linked' \
            || { echo "!! the relay did not build statically; CGO_ENABLED=0 is the requirement" >&2; exit 1; }

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every tracked shell script, not a hand-kept list, so a new script is
      # covered the day it is added.
      - name: bash -n over every tracked shell script
        run: |
          set -euo pipefail
          fails=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! bash -n "$f"; then
              echo "!! $f does not parse" >&2
              fails=$((fails + 1))
            fi
          done < <(git ls-files '*.sh')
          [ "$count" -gt 0 ] || { echo "!! no shell scripts found" >&2; exit 1; }
          [ "$fails" -eq 0 ] || exit 1
          echo "    $count shell scripts parse"

      # These fixtures drive the real cloud wrappers through fake AWS and SSM
      # seams. They cover validation, immutable uploads, pointer conditions,
      # activation rollback, and partial-failure handling without credentials,
      # network access, proprietary archives, or a live host.
      - name: AWS cloud-world transactions
        run: |
          set -euo pipefail
          for test in cloud/aws/test-*.sh; do
            "$test"
          done

      # Repository-wide diagnostics must not open ignored credential custody or
      # ordinary untracked runtime data. The test builds a throwaway repository
      # with tracked, ignored, untracked and symlinked canaries, then drives the
      # same helper developers use.
      - name: tracked-only repository search
        run: tools/test-search-tracked.sh

      # BLOCKING, and it needs no game and no install: the guard on the one
      # `rm -rf` the complete edition does, lifted out of the installer and the
      # uninstall themselves so a rule that changes in one and not in the other
      # fails here rather than on somebody's machine. Its PowerShell half runs in
      # the powershell job.
      - name: the managed-runtime rules
        run: release/test-runtime-rules.sh

      - name: systemd units
        run: deploy/test-units.sh

      # The monitor's transfer arithmetic is the only thing watching the bill,
      # and both of its failure modes are silent: a check that alerts every
      # tick gets muted, a check that never alerts is decoration. The script
      # drives the real monitor.sh through its read seams against fake /proc
      # files and a fake clock, so it needs no root, no network, no systemd and
      # no host — there is no reason for it not to run on every pull request.
      - name: monitor transfer arithmetic
        run: deploy/test-monitor.sh

      # The other half of the same money check. ce-reconcile.sh parses the
      # provider's billing answer, and that parser cannot be exercised against
      # the live API: each Cost Explorer call costs $0.01 and its answer changes
      # every day, so a test that called it would be both expensive and
      # non-repeatable. It runs against a saved response under deploy/testdata
      # and a fake metric provider, so it needs no AWS account, no network and
      # no host, and it spends nothing.
      - name: Cost Explorer reconciliation arithmetic
        run: deploy/test-ce-reconcile.sh

      # The viewer-presence signal decides whether the broadcast publishes at
      # all, so both of its failure modes are expensive and neither is visible
      # from the host: a false negative takes the stream off the air in front of
      # somebody who is watching it, and a false positive publishes 780 GB a
      # month into an empty room. The script drives the real
      # viewers-presence.sh through its read seams against a written access log,
      # a written metrics file and a fixed clock, so it needs no root, no
      # network, no nginx and no mediamtx.
      - name: viewer presence
        run: deploy/test-viewers-presence.sh

      # The broadcast world's presentation, identity and startup ordering.
      # install.sh mints this world its own map credential and protects it with
      # a Windows ACL, and run-windows.ps1 starts a sidecar, a game and OBS in
      # an order that a wrong edit silently inverts — a publisher started before
      # the sidecar broadcasts a world that is not on the map, and a watcher
      # started before OBS takes the stream down as soon as it can reach it.
      # The script asserts against the sources and sources install.sh for its
      # functions without ever running the installer, so it needs no Windows, no
      # game and no network: only jq, which the image has.
      - name: broadcast configuration
        run: deploy/local-broadcast/test-config.sh

      # HONEST SKIP, and here on purpose. test-watch-viewers.sh drives the real
      # watch-viewers.ps1 — the script that decides whether the broadcast
      # publishes at all — through `powershell.exe` and translates its paths
      # with `wslpath`, so it runs only on a WSL host with Windows interop. No
      # GitHub-hosted image is one: ubuntu-latest has `pwsh` but no
      # `powershell.exe` and no `wslpath`, and windows-latest has
      # `powershell.exe` but no `wslpath`, so moving this to the windows job
      # would skip there too. It is run rather than left out so that the skip
      # stays a clean, explained skip instead of an error, and so the day the
      # test loses its WSL dependency it starts covering CI without a change
      # here. deploy/local-broadcast/test-config.sh calls it on a real WSL
      # workstation, which is where its cases actually run today.
      - name: broadcast viewer watcher (WSL only; skips here)
        run: |
          set -euo pipefail
          out="$(deploy/local-broadcast/test-watch-viewers.sh)"
          printf '%s\n' "$out"
          case "$out" in
            *'SKIP, no '*|*': PASS'*) ;;
            *) echo "!! test-watch-viewers.sh neither ran nor skipped cleanly" >&2
               exit 1 ;;
          esac

      # ci-gate.sh is the forced command pinned to the deployment key, and the
      # account it runs as has passwordless sudo — so its refusals are the whole
      # boundary, not error handling. Most of that suite is an attempt to get
      # past it, and it needs no host, no root and no network.
      - name: the CI gate's verb allowlist
        run: deploy/test-ci-gate.sh

      # deploy.sh carries the kit and environment-file assertions that the three
      # hand-written host scripts had between them. This checks the one thing
      # about it that can be checked off a host: that its kit listing digest
      # still equals the one the operations source lock defines.
      - name: the deployment sequence
        run: deploy/test-deploy.sh

      # test-front-door.sh self-skips `nginx -t` when nginx or openssl is
      # absent, so installing them is what turns this from a text grep into a
      # real configuration check.
      #
      # APT IS THE ONLY PART OF THIS JOB THAT TOUCHES THE NETWORK, and so the
      # only part that can hang. A hosted runner resolves its Ubuntu mirror
      # through a mirrorlist and falls back to archive.ubuntu.com when the
      # Azure one does not answer — and apt's own default is to wait forever on
      # a transfer that has stalled rather than failed. Run 32069398306 spent
      # 9 m 18 s inside a single `apt-get update` fetch of one InRelease file
      # and took the whole job budget with it. That surfaces as a CANCELLED job
      # whose last line is "The operation was canceled", with no failing step
      # and no failing command: the least diagnosable shape a CI result has,
      # for a cause that has nothing to do with the change under test.
      #
      # So the network is bounded three times over, each bound catching what
      # the one inside it cannot:
      #
      #   Acquire::*::Timeout   a transfer that stops moving fails, instead of
      #                         holding the connection open indefinitely.
      #   timeout(1)            the command dies however it wedged, including
      #                         ways no apt option covers.
      #   timeout-minutes       the STEP is what the log blames, so the next
      #                         reader sees "install nginx" and not a job that
      #                         merely ran out of time.
      #
      # Only with a bound in place is a retry safe. An unreachable mirror is
      # the ordinary flake and must not fail a pull request over a change that
      # is fine; a mirror unreachable three times running is a real outage, and
      # then this says so in three minutes with the reason on screen.
      - name: install nginx for the front-door check
        timeout-minutes: 7
        run: |
          set -euo pipefail
          apt_get() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 90 apt-get \
                   -o Acquire::Retries=3 \
                   -o Acquire::http::Timeout=20 \
                   -o Acquire::https::Timeout=20 \
                   "$@"; then
                return 0
              fi
              echo "    apt-get $1: attempt $attempt did not finish; retrying" >&2
              sleep $((attempt * 5))
            done
            echo "!! apt-get $1 failed three times. The runner's package mirror" >&2
            echo "   is unreachable; this is not a finding about the change." >&2
            return 1
          }
          apt_get update
          apt_get install -y --no-install-recommends nginx-light openssl
          # nginx opens its compiled-in default error log BEFORE it reads -c,
          # and creates its temp paths under /var/lib/nginx. As an ordinary
          # user `nginx -t` would emit permission alerts there and could exit
          # non-zero on a configuration that is perfectly good.
          sudo install -d -m 1777 /var/log/nginx /var/lib/nginx
          # nginx lives in /usr/sbin, which is on PATH on GitHub's images but
          # need not be. Say so explicitly rather than relying on it.
          echo /usr/sbin >> "$GITHUB_PATH"
          sudo nginx -v

      # The whole point of installing nginx is the `nginx -t` leg, and the
      # script reports which leg it took. Require the real one: a silent fall
      # back to the render-only path would mean this job proves less than it
      # claims, which is the failure mode the release checks exist to refuse.
      - name: front door
        run: |
          set -euo pipefail
          out="$(deploy/test-front-door.sh)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq 'front-door render and nginx syntax, gate down and up: PASS' || {
            echo "!! test-front-door.sh skipped the nginx syntax check." >&2
            echo "   nginx or openssl is missing, so this job checked the rendered text" >&2
            echo "   only. Fix the install step; do not accept the skip." >&2
            exit 1
          }

      # The restart scripts are the procedures RESTART-POLICY.md describes, and
      # the day they are read is the day something is already wrong. --dry-run
      # walks every step and changes nothing, needs no host, no root and no
      # network, so a regression in either one is caught here rather than by an
      # operator at 03:00 with the relay already stopped.
      - name: restart procedures, dry run
        run: |
          set -euo pipefail
          deploy/restart-relay.sh --dry-run --reason 'CI dry run'
          deploy/restart-archive.sh --dry-run --reason 'CI dry run'
          deploy/restart-archive.sh --dry-run --rebuild-rollup --reason 'CI roll-up rebuild dry run'
          deploy/test-restart-archive.sh
          # The override must stay unusable without its proof text: an override
          # that records no reasoning is just a flag that turns the gate off.
          if deploy/restart-archive.sh --dry-run --i-proved-the-replay-fits >/dev/null 2>&1; then
            echo "!! --i-proved-the-replay-fits was accepted without --proof" >&2
            exit 1
          fi

      # restart-archive.sh's scratch directory holds a COPY OF deploy.env, so a
      # run that ends without removing it leaves every deployed parameter in
      # /tmp until somebody notices. Two host directories had been sitting there
      # for exactly that reason. TMPDIR points the scratch at an empty directory
      # so this counts only what these runs created, and the run that MUST leave
      # nothing is the one that fails: the refusal happens after the scratch
      # directory exists, which is the path the old code never cleaned.
      - name: the restart scripts leave no scratch behind
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          gate="$(mktemp -d)"
          TMPDIR="$scratch" deploy/restart-relay.sh --dry-run --reason 'CI leak check' >/dev/null
          TMPDIR="$scratch" deploy/restart-archive.sh --dry-run --reason 'CI leak check' >/dev/null
          : >"$gate/peer-gate.map"
          if TMPDIR="$scratch" MV_GATEDIR="$gate" \
             deploy/restart-archive.sh --dry-run --reason 'CI leak check' >/dev/null 2>&1; then
            echo "!! a gate file that already exists did not stop the run" >&2
            exit 1
          fi
          left="$(find "$scratch" -mindepth 1 -maxdepth 1 -print)"
          if [ -n "$left" ]; then
            echo "!! the restart scripts left scratch behind:" >&2
            printf '%s\n' "$left" >&2
            echo "   Each of these can hold a copy of deploy.env. Scratch must come" >&2
            echo "   from rl_mktemp_d, which the EXIT trap in restart-lib.sh clears." >&2
            exit 1
          fi
          rm -rf "$scratch" "$gate"
          echo "restart scratch: nothing left behind"

  installer:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # E6: apt's NSIS is a different build from the one the release machine
      # uses, so it is deliberately used only for this stub compile. The
      # release build keeps its own MAKENSIS, which is what the reproducible
      # checksum claim in release/README.md rests on.
      #
      # Bounded and retried exactly as the scripts job's nginx install is, and
      # for the same reason — see the long comment there. This job is two steps
      # long and one of them is this one, so an unbounded apt here does not
      # merely slow the job down, it IS the job.
      - name: install NSIS
        timeout-minutes: 7
        run: |
          set -euo pipefail
          apt_get() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout 90 apt-get \
                   -o Acquire::Retries=3 \
                   -o Acquire::http::Timeout=20 \
                   -o Acquire::https::Timeout=20 \
                   "$@"; then
                return 0
              fi
              echo "    apt-get $1: attempt $attempt did not finish; retrying" >&2
              sleep $((attempt * 5))
            done
            echo "!! apt-get $1 failed three times. The runner's package mirror" >&2
            echo "   is unreachable; this is not a finding about the change." >&2
            return 1
          }
          apt_get update
          apt_get install -y --no-install-recommends nsis nsis-common
          makensis -VERSION

      - name: compile the Windows installer against a stub payload
        run: release/check-nsis.sh

  powershell:
    name: powershell
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # BLOCKING. This project's PowerShell is written on a Linux box with no
      # PowerShell on it, so before this job existed a syntax error in an
      # installer was found by the first player who ran it. The parser only
      # reads the files; nothing is executed.
      - name: parse every PowerShell file
        shell: pwsh
        run: |
          $paths = @(
            'release/kit/*.ps1',
            'farend/setup-farend.ps1',
            'release/test-install-uninstall.ps1',
            'release/test-installer-wait.ps1',
            'release/test-runtime-rules.ps1',
            'deploy/local-broadcast/*.ps1'
          )
          ./release/pscheck.ps1 @paths

      # BLOCKING, and it needs no game and no install: the guard on the one
      # recursive delete the complete edition does, and the rule that decides
      # whose BepInEx a game folder holds. Both are lifted out of the installer
      # and the uninstall themselves, so a rule that changes in one and not in
      # the other fails here rather than on somebody's machine.
      - name: the managed-runtime rules
        shell: pwsh
        run: ./release/test-runtime-rules.ps1

      # BLOCKING, and deliberately `shell: powershell` — Windows PowerShell 5.1
      # is the engine the setup runs the installer window on, and the job-object
      # wait this test is about is that engine's. It needs no game, no network
      # and no install: a stub installer under the runner's temp folder stands in
      # for the real one, and its grandchild is a PowerShell that sleeps.
      - name: the installer window waits for the installer, not for the world
        shell: powershell
        run: ./release/test-installer-wait.ps1

      # ADVISORY (E11). Style findings are worth seeing, but a first run must
      # not turn into an open-ended cleanup. Only parse errors block, above.
      - name: PSScriptAnalyzer
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer
          $files = @(git ls-files '*.ps1')
          $findings = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ })
          if ($findings.Count -gt 0) {
            $findings |
              Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message |
              Out-String -Width 200 |
              Write-Host
            Write-Host "$($findings.Count) advisory finding(s)"
          } else {
            Write-Host 'no findings'
          }

  consistency:
    name: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A SHALLOW CHECKOUT IS ENOUGH, and that is a property worth keeping.
      # check-drift.sh compares this tree against values recorded in
      # docs/support-matrix.md — one tree hash, one manifest of the working tree
      # — so nothing here reads history. bump-version.sh and the tracked-binary
      # check read the working tree too. Do not add a step that walks history
      # without restoring fetch-depth: 0 in the same change.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # One release string, in 48 places across 21 files. --check asserts they
      # all agree, and fails when a version literal turns up in a file that is
      # not on the allowlist — so the surface cannot silently grow.
      - name: the version surface agrees
        run: release/bump-version.sh --check

      # Is this tree still the build somebody tested? The mod tree hash and the
      # cmd/sidecar input digest recorded in docs/support-matrix.md against what
      # this checkout holds. This is the source-level equivalent of
      # make-release.sh's gates 2 and 3, and it needs no game bytes and no .NET.
      - name: this tree is the build that was tested
        run: release/check-drift.sh

      # release/tracked-binaries.txt is the list, and it is a tracked plain
      # file rather than part of this workflow so that a documentation pull
      # request adding one image is an ordinary review, not a change to CI.
      - name: no unexpected tracked binary
        run: |
          set -euo pipefail
          list=release/tracked-binaries.txt
          [ -f "$list" ] || { echo "!! missing $list" >&2; exit 1; }
          allowed="$(mktemp)"
          found="$(mktemp)"
          grep -Ev '^[[:space:]]*(#|$)' "$list" | LC_ALL=C sort > "$allowed"
          [ -s "$allowed" ] || { echo "!! $list lists no path" >&2; exit 1; }
          # A tracked, non-empty file with no readable line. This is not the
          # rule git itself applies (git looks for a NUL byte in the first
          # 8000), but it is stricter in the direction that matters and it
          # catches a .dll under any name.
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            [ -s "$f" ] || continue
            grep -Iq . -- "$f" 2>/dev/null || printf '%s\n' "$f"
          done < <(git ls-files -z) | LC_ALL=C sort > "$found"
          if ! diff -u --label "$list" --label 'tracked binaries' "$allowed" "$found"; then
            echo >&2
            echo "!! the set of tracked binary files no longer matches $list." >&2
            echo "   A '+' line is a binary this pull request adds. Game assemblies," >&2
            echo "   build output and .dll files must never be committed" >&2
            echo "   (.github/CONTRIBUTING.md). If the new file genuinely belongs in" >&2
            echo "   the repository, add its path to $list in the same pull request," >&2
            echo "   and say in the description why the repository is that file's only" >&2
            echo "   distribution channel." >&2
            exit 1
          fi
          echo "    $(wc -l < "$found") tracked binary files, all listed in $list"
